[project]
name = "studio-processing-rest-modal-app"
version = "1.0.0"
description = "Authenticated sequential TAPNext++ and SAM REST gateway on Modal."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "modal>=1.5,<2",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
