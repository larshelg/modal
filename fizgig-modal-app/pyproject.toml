[project]
name = "fizgig-modal-app"
version = "0.1.0"
description = "Standalone Fizgig CLI training runtime on Modal."
requires-python = ">=3.11"
dependencies = [
    "modal>=1.5,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
